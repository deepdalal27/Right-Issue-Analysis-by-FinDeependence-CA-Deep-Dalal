name: probe
on: {push: {branches: ["claude/**"], paths: ["scripts/probe_bse.py"]}}
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/probe_bse.py
      - run: |
          git config user.name "probe-bot"; git config user.email "probe-bot@users.noreply.github.com"
          git add probe && git commit -m "probe output" && git push
