name: probe
on: [push, workflow_dispatch]
permissions: {contents: write}
jobs:
  probe:
    if: contains(github.event.head_commit.message, '[probe]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/probe.py
      - run: |
          git config user.name "probe-bot"; git config user.email "probe-bot@users.noreply.github.com"
          git add probe && git commit -m "probe output" && git push
